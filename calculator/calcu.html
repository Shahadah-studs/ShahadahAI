<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ShahadahAI - Calculator expirement</title> <link rel="icon" type="image/png" href="/bloxd-scene.png?v=1">  
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #05050a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; overflow: hidden; }
        .calc { width: 340px; background: rgba(20,20,35,0.75); backdrop-filter: blur(12px); border-radius: 24px; padding: 20px; border: 1px solid rgba(0,255,102,0.3); box-shadow: 0 0 25px rgba(0,255,102,0.15); display: flex; flex-direction: column; gap: 15px; }
        .hdr { text-align: center; }
        .hdr h2 { color: #00ff66; text-shadow: 0 0 10px #00ff66; font-size: 1.1rem; letter-spacing: 1px; }
        .hdr p { color: #ff007f; font-size: 0.7rem; font-weight: bold; margin-top: 2px; }
        #screen { width: 100%; padding: 15px; background: #020205; border: 1px solid rgba(0,240,255,0.4); border-radius: 15px; color: #00f0ff; text-align: right; font-size: 1.5rem; outline: none; font-weight: bold; text-shadow: 0 0 5px #00f0ff; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { background: rgba(13,13,25,0.8); border: 1px solid #ff007f; color: #fff; padding: 16px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #ff007f; box-shadow: 0 0 10px #ff007f; }
        button.op { border-color: #00f0ff; color: #00f0ff; }
        button.op:hover { background: #00f0ff; color: #000; box-shadow: 0 0 10px #00f0ff; }
        button.eq { grid-column: span 2; border-color: #00ff66; color: #00ff66; }
        button.eq:hover { background: #00ff66; color: #000; box-shadow: 0 0 10px #00ff66; }
    </style>
</head>
<body>
    <div class="calc">
        <div class="hdr"><h2>SHAHADAHAI</h2><p> Experimental Calculator v0.1</p></div>
        <input type="text" id="screen" readonly value="0">
        <div class="grid">
            <button class="op" onclick="clr()">C</button><button class="op" onclick="press('/')">/</button><button class="op" onclick="press('*')">*</button><button class="op" onclick="press('-')">-</button>
            <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('+')">+</button>
            <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="back()">⌫</button>
            <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="eq" onclick="calc()">=</button>
            <button onclick="press('0')" style="grid-column: span 2;">0</button><button onclick="press('.')">.</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>

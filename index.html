<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
      <link rel="icon" type="image/png" href="/bloxd-scene.png?v=1">  
    <title>Shahadah AI 0.1L</title>
    <style>* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background: #05050a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #e2e8f0; overflow: hidden; }

/* Loading Screen Styles */
.loading-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #05050a;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeOut 0.5s ease-in-out 2.5s forwards;
}

.loading-screen.hidden {
  display: none;
}

.loader-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 4px solid rgba(0, 255, 204, 0.2);
  border-top: 4px solid #00ffcc;
  border-right: 4px solid #ff0080;
  border-radius: 50%;
  animation: spin 1.2s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading-text {
  font-size: 1.4rem;
  color: #00ffcc;
  text-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
  letter-spacing: 2px;
  font-weight: bold;
  animation: pulse 1.5s ease-in-out infinite;
}

.loading-text::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%, 20% { content: ''; }
  40% { content: '.'; }
  60% { content: '..'; }
  80%, 100% { content: '...'; }
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

@keyframes fadeOut {
  0% { opacity: 1; visibility: visible; }
  100% { opacity: 0; visibility: hidden; }
}

.loading-subtitle {
  font-size: 0.9rem;
  color: #ff0080;
  text-shadow: 0 0 8px rgba(255, 0, 128, 0.5);
  letter-spacing: 1px;
}

/* Main Content */
.box { width: 500px; height: 700px; max-height: 90vh; background: rgba(20, 20, 35, .7); backdrop-filter: blur(12px); border-radius: 24px; box-shadow: 0 0 30px rgba(0,255,204,.15); display: flex; flex-direction: column; }
.hdr { background: linear-gradient(135deg, #121225, #1a1a36); padding: 20px; text-align: center; border-bottom: 2px solid #ff0080; flex-shrink: 0; }
.hdr h2 { color: #00ffcc; text-shadow: 0 0 12px rgba(0,255,204,.6); font-size: 1.6rem; letter-spacing: 1px; }
.hdr p { color: #ff0080; font-size: .8rem; font-weight: bold; margin-top: 4px; }
.body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(circle at 50% 30%, #111126, #05050b); height: calc(100% - 130px); }
.body::-webkit-scrollbar { width: 5px; }
.body::-webkit-scrollbar-thumb { background: linear-gradient(#ff0080, #00ffcc); border-radius: 3px; }
.msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14.5px; line-height: 1.5; white-space: pre-line; word-break: break-word; }
.user { background: linear-gradient(135deg, #ff0080, #b00058); align-self: flex-end; border-bottom-right-radius: 2px; }
.bot { background: rgba(26, 26, 51, .8); color: #00ffcc; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid rgba(0, 255, 204, .4); }
.tip { color: #ff0080; font-style: italic; font-size: 12px; animation: b 1s infinite alternate; }
@keyframes b { from { opacity: .4; } to { opacity: 1; } }
.input-area { display: flex; padding: 16px; border-top: 1px solid rgba(255, 255, 255, .05); background: #0c0c1a; flex-shrink: 0; }
#in { flex: 1; padding: 14px; background: #05050d; border: 1px solid #ff0080; border-radius: 30px; outline: none; color: #fff; padding-left: 20px; }
#in:focus { border-color: #00ffcc; box-shadow: 0 0 12px rgba(0,255,204,.4); }
#btn { background: transparent; color: #00ffcc; border: 2px solid #00ffcc; padding: 0 25px; margin-left: 10px; border-radius: 30px; cursor: pointer; font-weight: bold; }
#btn:hover { background: #00ffcc; color: #05050a; box-shadow: 0 0 15px #00ffcc; }

    </style>
</head>
<body>
    <!-- Loading Screen for getting the JS warmed up -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loading-text">Initializing SHAHADAH AI</div>
            <div class="loading-subtitle">Booting up JS...</div>
        </div>
    </div>

    <div class="box">
        <div class="hdr"><h2>SHAHADAH AI 0.1L</h2><p>An AI chatbot Emulator</p></div>
        <div class="body" id="out">
            <div class="msg bot">Oh, look who decided to launch my script! Ask me about Islam, coding bugs, real-life drama, or existential dread. Try asking the same thing twice—I dare you.</div>
        </div>
        <div class="input-area">
            <input type="text" id="in" placeholder="Ask me anything dude..." autocomplete="off">
            <button id="btn">SEND</button>
        </div>
    </div>

    <!-- Links MY external logic file -->
    <script src="script.js"></script>
    <script>
        // Hide loading screen after 2.5 seconds
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.classList.add('hidden');
            }, 2500);
        });
    </script>
</body>
</html>
